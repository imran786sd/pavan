<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This meta tag is crucial for making it scale correctly on mobile phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Appointment - Dr. Pavan</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Import a modern, app-like font -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #333; /* Dark background outside the app wrapper */
      margin: 0; 
      padding: 0; 
    }
    
    /* Forces the app to look like a phone screen on desktops */
    .mobile-wrapper {
      max-width: 414px; /* Standard iPhone width */
      margin: 0 auto;
      background-color: #f0f4fd; /* Light blue background for the slots area */
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      padding-bottom: 90px;
    }

    /* --- THE WHITE HEADER SECTION --- */
    .header-section {
      background-color: #ffffff;
      padding: 20px 20px 15px 20px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .app-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 600;
      font-size: 18px;
      color: #111;
      margin-bottom: 25px;
    }
    .back-btn { font-size: 22px; cursor: pointer; color: #555; }
    .month-selector {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    /* --- DATE STRIP --- */
    .date-strip {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 65px;
      min-width: 50px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      background: transparent;
    }
    .date-item .day { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 4px; }
    .date-item .num { font-size: 16px; font-weight: 700; color: #111; }
    
    /* The active blue date pill */
    .date-item.active { background-color: #2558d6; box-shadow: 0 4px 10px rgba(37,88,214,0.3); }
    .date-item.active .day, .date-item.active .num { color: #ffffff; }

    /* --- SLOTS SECTION --- */
    .slots-section { padding: 20px; }
    .section-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 12px; margin-top: 10px; }
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .slot { 
      background-color: #ffffff; 
      color: #333; 
      font-size: 12px; 
      font-weight: 600; 
      padding: 14px 0; 
      text-align: center; 
      border-radius: 8px; 
      cursor: pointer; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
      transition: 0.2s;
    }
    .slot.selected { background-color: #2558d6; color: #ffffff; box-shadow: 0 4px 10px rgba(37,88,214,0.3); }
    .slot.locked { opacity: 0.5; background: #e0e0e0; cursor: not-allowed; color: #777; box-shadow: none; }
    .slot.my-booking { background-color: #27ae60; color: #ffffff; }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar { 
      position: absolute; /* Kept absolute within the wrapper */
      bottom: 0; 
      width: 100%; 
      background: #ffffff; 
      padding: 20px; 
      box-sizing: border-box; 
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06); 
      border-top-left-radius: 24px; 
      border-top-right-radius: 24px; 
      display: none; 
    }
    .btn-confirm { 
      background-color: #2558d6; 
      color: #ffffff; 
      border: none; 
      padding: 16px; 
      width: 100%; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 16px; 
      cursor: pointer; 
    }
    .btn-confirm:disabled { background-color: #b0c4f5; cursor: not-allowed; }
    
    /* --- SCREENS --- */
    .screen { display: none; padding: 40px 20px; text-align: center; background: #fff; min-height: 100vh; box-sizing: border-box; }
    input { width: 100%; padding: 14px; margin: 10px 0 20px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; font-family: 'Inter', sans-serif;}
    .btn-primary { background: #2558d6; color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn-google { background: #fff; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px;}
    .btn-logout { background: transparent; color: #e74c3c; border: none; margin-top: 20px; font-weight: bold; cursor: pointer; }
    #empty-msg { text-align: center; color: #777; margin-top: 30px; font-weight: 600; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- SCREEN 1: Login -->
    <div id="screen-login" class="screen" style="display: block;">
      <h2>Dr. Pavan's Clinic</h2>
      <p>Please verify your identity to book a slot.</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20">
        Sign in with Google
      </button>
    </div>

    <!-- SCREEN 2: Details -->
    <div id="screen-details" class="screen">
      <h2>Patient Details</h2>
      <input type="text" id="patient-name" placeholder="Full Name">
      <input type="tel" id="patient-phone" placeholder="Phone Number">
      <button class="btn-primary" onclick="saveDetails()">Continue to Booking</button>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>

    <!-- SCREEN 3: Calendar & Booking UI -->
    <div id="screen-booking" style="display: none;">
      
      <!-- The White Header Block -->
      <div class="header-section">
        <div class="app-bar">
          <span class="back-btn" onclick="logout()">←</span>
          <span>Appointment</span>
        </div>
        
        <div class="month-selector" id="month-label">August ▾</div>
        
        <div class="date-strip" id="date-strip">
          <!-- Dates injected by JS -->
        </div>
      </div>

      <!-- The Light Blue Slots Area -->
      <div class="slots-section" id="slots-container">
        <!-- Slots injected by JS -->
      </div>

      <!-- The White Bottom Bar -->
      <div class="bottom-bar" id="bottom-bar">
        <button class="btn-confirm" id="btn-confirm" onclick="executeBooking()" disabled>Confirm Appointment</button>
      </div>
    </div>
  </div> <!-- End Mobile Wrapper -->

  <script>
    const supabaseUrl = 'https://furgtyybhypajuujyaun.supabase.co';
    // TOBI: PASTE YOUR LONG eyJ... KEY HERE!
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1cmd0eXliaHlwYWp1dWp5YXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Nzk2MTksImV4cCI6MjEwNDM1NTYxOX0.mLh5sblYrOKjoey_LWcmUS4NQrqXrEyDzrDB6yWAKUE'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentName = localStorage.getItem('clinic_name') || '';
    let currentPhone = localStorage.getItem('clinic_phone') || '';
    let currentUserId = null;
    let cachedSlots = []; 
    let selectedSlotIdToBook = null;

    function getFormatDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    let selectedDate = getFormatDate(new Date());

    function showScreen(screenId) {
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-details').style.display = 'none';
      document.getElementById('screen-booking').style.display = 'none';
      document.getElementById(screenId).style.display = 'block';
    }

    function handleSession(session) {
      if (session) {
        currentUserId = session.user.id;
        const googleName = session.user.user_metadata.full_name;
        if (googleName && !currentName) currentName = googleName;
        
        document.getElementById('patient-name').value = currentName;
        document.getElementById('patient-phone').value = currentPhone;

        if (currentName && currentPhone) {
          showScreen('screen-booking');
          renderDateStrip();
          loadSlots();
        } else {
          showScreen('screen-details'); 
        }
      } else {
        currentUserId = null;
        showScreen('screen-login');
      }
    }

    supabaseClient.auth.getSession().then(({ data: { session } }) => handleSession(session));
    supabaseClient.auth.onAuthStateChange((event, session) => handleSession(session));

    async function loginWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://imran786sd.github.io/pavan/' }
      });
      if (error) alert("Error logging in: " + error.message);
    }

    async function logout() {
      const { error } = await supabaseClient.auth.signOut();
      if (!error) {
        localStorage.removeItem('clinic_name');
        localStorage.removeItem('clinic_phone');
        currentName = ''; currentPhone = ''; currentUserId = null;
        document.getElementById('patient-name').value = '';
        document.getElementById('patient-phone').value = '';
      }
    }

    function saveDetails() {
      const nameInput = document.getElementById('patient-name').value;
      const phoneInput = document.getElementById('patient-phone').value;
      if (!nameInput || !phoneInput) return alert('Please enter both details.');
      
      localStorage.setItem('clinic_name', nameInput);
      localStorage.setItem('clinic_phone', phoneInput);
      currentName = nameInput; currentPhone = phoneInput;
      
      showScreen('screen-booking');
      renderDateStrip();
      loadSlots();
    }

    function renderDateStrip() {
      const strip = document.getElementById('date-strip');
      strip.innerHTML = '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      let baseDate = new Date();
      
      for(let i=0; i<14; i++) {
        let d = new Date();
        d.setDate(baseDate.getDate() + i);
        
        const dateStr = getFormatDate(d);
        const dayName = days[d.getDay()];
        const dateNum = String(d.getDate()).padStart(2, '0');
        
        if(dateStr === selectedDate) {
          document.getElementById('month-label').innerText = months[d.getMonth()] + ' ' + d.getFullYear() + ' ▾';
        }

        const div = document.createElement('div');
        div.className = dateStr === selectedDate ? 'date-item active' : 'date-item';
        div.innerHTML = `<span class="day">${dayName}</span><span class="num">${dateNum}</span>`;
        
        div.onclick = () => {
          selectedDate = dateStr;
          selectedSlotIdToBook = null; 
          renderDateStrip(); 
          loadSlots();
        };
        
        strip.appendChild(div);
      }
    }

    function getTimeCategory(timeStr) {
      const isPM = timeStr.includes('PM');
      let hour = parseInt(timeStr.split(':')[0]);
      
      if (isPM && hour !== 12) hour += 12;
      if (!isPM && hour === 12) hour = 0;

      if (hour < 12) return 'Morning Slots';
      if (hour >= 12 && hour < 16) return 'Afternoon Slots';
      return 'Evening Slots';
    }

    async function loadSlots() {
      const container = document.getElementById('slots-container');
      const bottomBar = document.getElementById('bottom-bar');
      
      container.innerHTML = '<p id="empty-msg">Checking availability...</p>';
      bottomBar.style.display = 'none';
      
      const { data, error } = await supabaseClient.from('appointments').select('*').eq('date', selectedDate).order('time_slot');
      
      if (error) return container.innerHTML = `<p id="empty-msg" style="color:red;">Database Error</p>`;
      
      cachedSlots = data || [];
      renderSlots();
    }

    function renderSlots() {
      const container = document.getElementById('slots-container');
      const bottomBar = document.getElementById('bottom-bar');
      const confirmBtn = document.getElementById('btn-confirm');
      
      if (cachedSlots.length === 0) {
        container.innerHTML = '<p id="empty-msg">No slots created for this date.</p>';
        bottomBar.style.display = 'none';
        return;
      }

      container.innerHTML = ''; 
      bottomBar.style.display = 'block'; 
      
      const userAlreadyBooked = cachedSlots.some(slot => slot.user_id === currentUserId && slot.status !== 'available');
      const groupedSlots = { 'Morning Slots': [], 'Afternoon Slots': [], 'Evening Slots': [] };
      cachedSlots.forEach(slot => { groupedSlots[getTimeCategory(slot.time_slot)].push(slot); });

      for (const category in groupedSlots) {
        if (groupedSlots[category].length === 0) continue;

        const title = document.createElement('div');
        title.className = 'section-title';
        title.innerText = category;
        container.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'slots-grid';

        groupedSlots[category].forEach(slot => {
          const div = document.createElement('div');
          
          if (slot.user_id === currentUserId && slot.status !== 'available') {
            div.className = 'slot my-booking';
            div.innerText = slot.time_slot;
            div.onclick = () => cancelMyBooking(slot.id); 
          } 
          else if (slot.status !== 'available') {
            div.className = 'slot locked';
            div.innerText = slot.time_slot;
          } 
          else {
            div.className = slot.id === selectedSlotIdToBook ? 'slot selected' : 'slot';
            div.innerText = slot.time_slot;
            div.onclick = () => {
              if (userAlreadyBooked) {
                alert('You already have a booking on this date! Click your green slot to cancel it first.');
              } else {
                selectedSlotIdToBook = slot.id;
                renderSlots(); 
              }
            };
          }
          grid.appendChild(div);
        });
        container.appendChild(grid);
      }
      
      if (selectedSlotIdToBook) {
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Confirm Appointment";
      } else {
        confirmBtn.disabled = true;
        confirmBtn.innerText = "Select a time slot";
      }
    }

    async function executeBooking() {
      if (!selectedSlotIdToBook) return;
      
      const confirmBtn = document.getElementById('btn-confirm');
      confirmBtn.innerText = "Booking...";
      confirmBtn.disabled = true;

      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: 'booked', patient_name: currentName, phone: currentPhone, user_id: currentUserId })
        .eq('id', selectedSlotIdToBook);
      
      if(!error) {
        selectedSlotIdToBook = null; 
        alert('Booking Successful!');
        loadSlots(); 
      } else {
        alert('Error: ' + error.message);
        selectedSlotIdToBook = null;
        loadSlots();
      }
    }

    async function cancelMyBooking(slotId) {
      if (!confirm('Cancel your appointment? This will release the slot.')) return;
      
      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: 'available', patient_name: null, phone: null, user_id: null })
        .eq('id', slotId);
        
      if(!error) {
        selectedSlotIdToBook = null;
        loadSlots(); 
      } else {
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>
</html>
