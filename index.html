<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. M. S. N. Pavan Kumar - Cardiology Clinic</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 20px; 
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    
    /* Date Picker Styling */
    .date-picker-container { margin-bottom: 20px; }
    input[type="date"] { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    
    .slot { 
      background: #1a73e8; 
      color: white; 
      padding: 15px 30px; 
      margin: 10px; 
      border-radius: 8px; 
      cursor: pointer; 
      display: inline-block; 
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }
    .slot:hover { background: #1557b0; }
    .locked { background: #bdc3c7; cursor: not-allowed; box-shadow: none; }
    .locked:hover { background: #bdc3c7; }
    .my-locked { background: #27ae60; } /* Turns green for the slot YOU clicked */
    .my-locked:hover { background: #219653; }
    #error-msg { color: #e74c3c; font-weight: bold; margin-top: 20px; }
  </style>
  
  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  
  <h1>Dr. M. S. N. Pavan Kumar</h1>
  <div class="subtitle">
    Sr. Consultant Interventional Cardiologist<br>
    MD, DM (NIMS)
  </div>

  <!-- NEW: Date Picker -->
  <div class="date-picker-container">
    <label for="appointment-date"><strong>Select Date: </strong></label>
    <input type="date" id="appointment-date" onchange="loadSlots()">
  </div>
  
  <p>Available times:</p>
  
  <div id="slots-container">Loading slots...</div>
  <div id="error-msg"></div>

  <script>
    const supabaseUrl = 'https://furgtyybhypajuujyaun.supabase.co';
    // TOBI: PASTE YOUR LONG KEY HERE!
    const supabaseKey = 'PASTE_YOUR_LONG_EYJ_ANON_KEY_HERE'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // LOGIC 1: Prevent multiple clicks
    let myLockedSlotId = null;

    // LOGIC 2: Block past dates by setting the minimum date to Today
    const dateInput = document.getElementById('appointment-date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today; // Blocks past dates
    dateInput.value = today; // Defaults to today

    async function loadSlots() {
      const container = document.getElementById('slots-container');
      const errorContainer = document.getElementById('error-msg');
      const selectedDate = dateInput.value;
      
      errorContainer.innerText = ''; 
      container.innerHTML = 'Checking availability...';
      
      // Fetch data only for the selected date
      const { data, error } = await supabaseClient
        .from('appointments')
        .select('*')
        .eq('date', selectedDate)
        .order('time_slot');
      
      if (error) {
        container.innerHTML = '';
        errorContainer.innerText = `Database Error: ${error.message}`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = 'No slots available for this date.';
        return;
      }

      container.innerHTML = ''; 
      data.forEach(slot => {
        const div = document.createElement('div');
        
        // Check if this is the slot the user just clicked
        if (slot.id === myLockedSlotId) {
          div.className = 'slot my-locked';
          div.innerText = slot.time_slot + ' (Selected)';
        } else {
          div.className = slot.status === 'available' ? 'slot' : 'slot locked';
          div.innerText = slot.time_slot + (slot.status !== 'available' ? ' (Locked)' : '');
        }
        
        if(slot.status === 'available' && slot.id !== myLockedSlotId) {
          div.onclick = () => lockSlot(slot.id);
        }
        container.appendChild(div);
      });
    }

    async function lockSlot(id) {
      // Check if the user already clicked a slot
      if (myLockedSlotId !== null) {
        alert('You can only select one slot per day! Please refresh the page if you want to change it.');
        return;
      }

      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: 'locked', locked_at: new Date().toISOString() })
        .eq('id', id);
      
      if(!error) {
        myLockedSlotId = id; // Remember that THIS user locked THIS slot
        loadSlots(); // Refresh the UI (it will turn green)
      } else {
        alert('Sorry, someone else just grabbed this slot.');
        loadSlots();
      }
    }

    loadSlots(); 
  </script>
</body>
</html>
