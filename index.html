<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Pavan Kumar MSN</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    .slot { background: #1a73e8; color: white; padding: 15px; margin: 10px; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold;}
    .locked { background: #ccc; cursor: not-allowed; }
  </style>
  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Dr. M. S. N. Pavan Kumar
Occupation: Sr. Consultant Interventional Cardiologist

Qualifications: MD, DM (NIMS)</h1>
  <p>Select a time for your appointment:</p>
  
  <div id="slots-container">Loading slots...</div>

  <script>
    // Initialize Supabase
    // Initialize Supabase
    const supabaseUrl = 'https://furgtyybhypajuujyaun.supabase.co';
    const supabaseKey = 'sb_publishable_pftNHgVcw025hBQ99stQ-Q_gbv1WawM';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    async function loadSlots() {
      const { data, error } = await supabase.from('appointments').select('*').order('time_slot');
      const container = document.getElementById('slots-container');
      container.innerHTML = ''; // Clear loading text

      data.forEach(slot => {
        const div = document.createElement('div');
        div.className = slot.status === 'available' ? 'slot' : 'slot locked';
        div.innerText = slot.time_slot + (slot.status !== 'available' ? ' (Locked)' : '');
        
        if(slot.status === 'available') {
          div.onclick = () => lockSlot(slot.id);
        }
        container.appendChild(div);
      });
    }

    async function lockSlot(id) {
      // Update the database to 'locked'
      const { error } = await supabase
        .from('appointments')
        .update({ status: 'locked', locked_at: new Date().toISOString() })
        .eq('id', id);
      
      if(!error) {
        alert('Slot temporarily locked for you! Proceeding to details...');
        loadSlots(); // Refresh the UI
      } else {
        alert('Sorry, someone else just grabbed this slot.');
      }
    }

    loadSlots(); // Run on page load
  </script>
</body>
</html>
