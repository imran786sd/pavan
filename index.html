<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. M. S. N. Pavan Kumar - Cardiology Clinic</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    
    .screen { display: none; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .active-screen { display: block; }
    
    input { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    
    button { background: #1a73e8; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #1557b0; }
    
    .btn-google { background: #fff; color: #444; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { background: #f1f1f1; }
    .btn-google img { width: 20px; }
    
    /* Logout Button Styling */
    .btn-logout { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; margin-top: 20px; }
    .btn-logout:hover { background: #e74c3c; color: white; }
    
    .date-picker-container { margin-bottom: 20px; }
    .slot { background: #1a73e8; color: white; padding: 15px 20px; margin: 8px; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold; }
    .locked { background: #bdc3c7; cursor: not-allowed; }
    
    #error-msg { color: #e74c3c; font-weight: bold; margin-top: 15px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  
  <h1>Dr. M. S. N. Pavan Kumar</h1>
  <div class="subtitle">Sr. Consultant Interventional Cardiologist<br>MD, DM (NIMS)</div>

  <!-- SCREEN 1: Login -->
  <div id="screen-login" class="screen">
    <h3>Step 1: Verification</h3>
    <p>Please verify your identity to book a slot.</p>
    <button class="btn-google" onclick="loginWithGoogle()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
      Sign in with Google
    </button>
  </div>

  <!-- SCREEN 2: Details -->
  <div id="screen-details" class="screen">
    <h3>Step 2: Patient Details</h3>
    <input type="text" id="patient-name" placeholder="Full Name">
    <input type="tel" id="patient-phone" placeholder="Phone Number">
    <button onclick="saveDetails()">Continue to Calendar</button>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>

  <!-- SCREEN 3: Calendar -->
  <div id="screen-booking" class="screen">
    <h3>Step 3: Select Appointment</h3>
    <div class="date-picker-container">
      <label><strong>Date: </strong></label>
      <input type="date" id="appointment-date" onchange="loadSlots()">
    </div>
    <div id="slots-container">Loading calendar...</div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>

  <script>
    const supabaseUrl = 'https://furgtyybhypajuujyaun.supabase.co';
    
    // TOBI: PASTE YOUR LONG eyJ... KEY HERE!
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1cmd0eXliaHlwYWp1dWp5YXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Nzk2MTksImV4cCI6MjEwNDM1NTYxOX0.mLh5sblYrOKjoey_LWcmUS4NQrqXrEyDzrDB6yWAKUE'; 
    
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentName = '';
    let currentPhone = '';

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
      document.getElementById(screenId).classList.add('active-screen');
    }

    // NEW: Automatically detect when the user logs in or logs out
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        // User successfully logged in
        const googleName = session.user.user_metadata.full_name;
        if (googleName && !document.getElementById('patient-name').value) {
          document.getElementById('patient-name').value = googleName;
        }
        showScreen('screen-details'); 
      } else {
        // User is not logged in (or just logged out)
        showScreen('screen-login');
      }
    });

    async function loginWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://imran786sd.github.io/pavan/'
        }
      });
      if (error) alert("Error logging in: " + error.message);
    }

    async function logout() {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        alert("Error signing out: " + error.message);
      } else {
        // Clear the local variables
        currentName = '';
        currentPhone = '';
        document.getElementById('patient-name').value = '';
        document.getElementById('patient-phone').value = '';
        // The onAuthStateChange listener will automatically flip back to Step 1
      }
    }

    function saveDetails() {
      const nameInput = document.getElementById('patient-name').value;
      const phoneInput = document.getElementById('patient-phone').value;
      
      if (!nameInput || !phoneInput) return alert('Please enter both your name and phone number.');
      
      currentName = nameInput;
      currentPhone = phoneInput;
      
      const dateInput = document.getElementById('appointment-date');
      // Sets today's date safely in YYYY-MM-DD format
      const today = new Date().toLocaleDateString('en-CA'); 
      dateInput.min = today;
      if (!dateInput.value) {
        dateInput.value = today;
      }
      
      showScreen('screen-booking');
      loadSlots();
    }

    async function loadSlots() {
      const container = document.getElementById('slots-container');
      const dateInput = document.getElementById('appointment-date').value;
      
      container.innerHTML = 'Checking availability...';
      
      const { data, error } = await supabaseClient.from('appointments').select('*').eq('date', dateInput).order('time_slot');
      
      if (error) return container.innerHTML = `<span style="color:red;">Database Error</span>`;
      if (!data || data.length === 0) return container.innerHTML = 'No slots available for this date.';

      container.innerHTML = ''; 
      data.forEach(slot => {
        const div = document.createElement('div');
        div.className = slot.status === 'available' ? 'slot' : 'slot locked';
        div.innerText = slot.time_slot + (slot.status !== 'available' ? ' (Booked)' : '');
        
        if(slot.status === 'available') {
          div.onclick = () => confirmBooking(slot.id);
        }
        container.appendChild(div);
      });
    }

    async function confirmBooking(slotId) {
      if (!confirm(`Book this slot for ${currentName}?`)) return;

      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: 'booked', patient_name: currentName, phone: currentPhone })
        .eq('id', slotId);
      
      if(!error) {
        alert('Booking Successful! We look forward to seeing you.');
        loadSlots(); 
      } else {
        alert('Error: Someone else may have just booked this slot.');
        loadSlots();
      }
    }
  </script>
</body>
</html>
